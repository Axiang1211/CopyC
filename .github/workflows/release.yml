name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要發布的版本 tag（例如 v1.0.0）；留空則只建置不發布"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # 只有真的設定了 Apple secrets 才傳給 Tauri；空字串會被當成「有憑證」而匯入失敗
      - name: Configure Apple signing (optional)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__COPYC_EOF__"; printf '%s\n' "${!v}"; echo "__COPYC_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
      # Universal Binary：同時支援 Apple Silicon 與 Intel；未設定憑證時使用 ad-hoc 簽章
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
      # 固定檔名，官網的 releases/latest/download/<檔名> 才能永遠指向最新版
      - name: Stage release files
        run: |
          mkdir -p dist/release
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/release/CopyC-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: copyc-macos-installer
          path: dist/release/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - name: Decode signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        shell: pwsh
        run: '[IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))'
      - name: Package MSIX
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Microsoft Store 上架時，到 repo Settings → Variables 填入 Partner Center「產品身分識別」的三個值
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $opts = @{}
          if ($env:MSIX_IDENTITY_NAME) { $opts.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $opts.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $opts.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          if ($env:WINDOWS_CERTIFICATE) {
            $opts.CertPath = "$env:RUNNER_TEMP\cert.pfx"
            $opts.CertPassword = $env:WINDOWS_CERTIFICATE_PASSWORD
          }
          ./scripts/build-msix.ps1 @opts
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)[0] dist/release/CopyC-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: copyc-windows-installer
          path: dist/release/*
      # .msix 只給開發者（上架 Microsoft Store 用），不會附加到公開 Release
      - uses: actions/upload-artifact@v4
        with:
          name: copyc-msix-private
          path: dist/*.msix

  # 推送 v* tag，或手動執行時填入 release_tag，就會發布正式 Release（tag 不存在時自動建立在本次 commit）
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 只取公開安裝包（*-installer），.msix 不會出現在 Release
      - uses: actions/download-artifact@v4
        with:
          pattern: copyc-*-installer
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CopyC ${{ inputs.release_tag || github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: artifacts/*
