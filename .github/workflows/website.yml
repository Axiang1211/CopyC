name: Deploy website

# 把 website/ 部署到 Cloudflare Pages（專案名稱 copyc）。
# 需要 repository secrets：CLOUDFLARE_API_TOKEN（權限：Cloudflare Pages:Edit）與 CLOUDFLARE_ACCOUNT_ID。
on:
  push:
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Cloudflare secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，略過部署。"
      - name: Ensure Pages project exists
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: npx --yes wrangler@3 pages project create copyc --production-branch="${{ github.event.repository.default_branch }}"
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy website --project-name=copyc --branch="${{ github.ref_name }}" --commit-dirty=true
