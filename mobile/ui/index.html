<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CopyC</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="logo.svg" alt="" width="40" height="40">
    <div class="brand"><b>Copy<span>C</span></b><small data-i18n="tagline"></small></div>
    <span class="pill" id="pill" hidden><i></i><span id="pill-text"></span></span>
  </header>

  <main>
    <!-- 沒有 Google 授權外掛（例如在電腦上開發） -->
    <section class="card" id="unavailable" hidden>
      <h2 data-i18n="unavailable.title"></h2>
      <p data-i18n="unavailable.body"></p>
    </section>

    <!-- 尚未登入 -->
    <section class="card" id="signed-out" hidden>
      <h2 data-i18n="out.title"></h2>
      <p data-i18n="out.body"></p>
      <button class="press btn primary" id="sign-in" type="button"><span class="spinner" id="sign-in-spin" aria-hidden="true" hidden></span><span id="sign-in-text"></span></button>
      <p class="hint" data-i18n="out.privacy"></p>
    </section>

    <!-- 已登入 -->
    <section id="signed-in" hidden>
      <div class="card">
        <p class="account" id="account"></p>
        <button class="press btn primary big" id="send" type="button">
          <svg class="icon-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V5m0 0-5 5m5-5 5 5"/><path d="M5 20h14"/></svg>
          <span data-i18n="in.send"></span>
        </button>
        <p class="hint" data-i18n="in.hint"></p>
      </div>

      <div class="tabs" role="tablist">
        <span class="tab-ind" aria-hidden="true"></span>
        <button class="press" role="tab" id="tab-recent" aria-selected="true" type="button" data-i18n="tab.recent"></button>
        <button class="press" role="tab" id="tab-history" aria-selected="false" type="button" data-i18n="tab.history"></button>
        <button class="press" role="tab" id="tab-settings" aria-selected="false" type="button" data-i18n="tab.settings"></button>
      </div>

      <!-- 最近：這支手機收到與送出的 -->
      <div id="panel-recent" role="tabpanel">
        <ol class="list" id="list"></ol>
        <p class="empty" id="empty" data-i18n="in.empty"></p>
      </div>

      <!-- 歷史紀錄：各電腦備份到 Google Drive 的 -->
      <div id="panel-history" role="tabpanel" hidden>
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="search" type="search" autocomplete="off" data-i18n-placeholder="hist.search">
        </div>
        <div class="chips" id="chips"></div>
        <p class="hist-state" id="hist-state"></p>
        <ol class="list" id="hist-list"></ol>
        <button class="press btn ghost small" id="hist-more" type="button" data-i18n="hist.more" hidden></button>
      </div>

      <!-- 設定 -->
      <div id="panel-settings" role="tabpanel" hidden>
        <div class="card setting">
          <div><h3 data-i18n="set.auto"></h3><p data-i18n="set.autoDesc"></p></div>
          <input type="checkbox" class="switch" id="pref-auto">
        </div>
        <div class="card setting">
          <div><h3 data-i18n="set.bg"></h3><p data-i18n="set.bgDesc"></p></div>
          <input type="checkbox" class="switch" id="pref-bg">
        </div>
        <div class="card setting">
          <div><h3 data-i18n="set.lan"></h3><p data-i18n="set.lanDesc"></p><p class="note" id="lan-note" hidden></p></div>
          <input type="checkbox" class="switch" id="pref-lan">
        </div>
        <div class="card lang-setting" hidden>
          <button class="row-btn lang-open press" type="button">
            <h3 data-i18n="set.lang"></h3>
            <span class="value lang-name"></span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
        <div class="card">
          <h3 data-i18n="set.tile"></h3>
          <p data-i18n="set.tileDesc"></p>
        </div>
        <button class="press btn ghost small" id="sign-out" type="button" data-i18n="in.signOut"></button>
      </div>
    </section>
  </main>

  <!-- 語言選單：從下方滑出，目前的語言有對勾 -->
  <div id="lang-sheet" hidden>
    <div class="sheet-scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lang-title">
      <div class="grab"></div>
      <h3 id="lang-title" data-i18n="set.lang"></h3>
      <div role="listbox" id="lang-options" aria-labelledby="lang-title"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <footer class="foot">
    <button class="lang-foot lang-open press" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span class="lang-name"></span>
    </button>
    <span data-i18n="foot"></span>
  </footer>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
