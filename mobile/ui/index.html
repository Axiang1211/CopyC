<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CopyC</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="logo.svg" alt="" width="40" height="40">
    <div class="brand"><b>Copy<span>C</span></b><small data-i18n="tagline"></small></div>
    <span class="pill" id="pill" hidden><i></i><span id="pill-text"></span></span>
  </header>

  <main>
    <!-- 沒有 Google 授權外掛（例如在電腦上開發） -->
    <section class="card" id="unavailable" hidden>
      <h2 data-i18n="unavailable.title"></h2>
      <p data-i18n="unavailable.body"></p>
    </section>

    <!-- 尚未登入 -->
    <section class="card" id="signed-out" hidden>
      <h2 data-i18n="out.title"></h2>
      <p data-i18n="out.body"></p>
      <button class="press btn primary" id="sign-in" type="button"><span class="spinner" id="sign-in-spin" aria-hidden="true" hidden></span><span id="sign-in-text"></span></button>
      <p class="hint" data-i18n="out.privacy"></p>
    </section>

    <!-- 已登入 -->
    <section id="signed-in" hidden>
      <h1 class="page-title" id="page-title"></h1>

      <!-- 底部導覽列（對應電腦版左側的深色側邊欄） -->
      <nav class="tabs" role="tablist">
        <button class="press" role="tab" id="tab-recent" aria-selected="true" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
          <span data-i18n="tab.recent"></span>
        </button>
        <button class="press" role="tab" id="tab-files" aria-selected="false" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8.5h13M14 5l3.5 3.5L14 12"/><path d="M19.5 15.5h-13M10 12l-3.5 3.5L10 19"/></svg>
          <span data-i18n="tab.files"></span>
        </button>
        <button class="press" role="tab" id="tab-history" aria-selected="false" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 12a7.4 7.4 0 1 0 2.2-5.3"/><path d="M4.4 4.6v3.4h3.4"/><path d="M12 8v4.3l2.9 1.8"/></svg>
          <span data-i18n="tab.history"></span>
        </button>
        <button class="press" role="tab" id="tab-settings" aria-selected="false" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4 6 18M18 18l-1.6-1.6M7.6 7.6 6 6"/></svg>
          <span data-i18n="tab.settings"></span>
        </button>
      </nav>

      <!-- 最近：這支手機收到與送出的 -->
      <div id="panel-recent" role="tabpanel">
        <div class="hero">
          <p class="hero-status"><i aria-hidden="true"></i><span id="account"></span></p>
          <button class="press btn cta big" id="send" type="button">
            <svg class="icon-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17V5m0 0-5 5m5-5 5 5"/><path d="M5 20h14"/></svg>
            <span data-i18n="in.send"></span>
          </button>
          <p class="hint" data-i18n="in.hint"></p>
        </div>
        <ol class="list" id="list"></ol>
        <p class="empty" id="empty" data-i18n="in.empty"></p>
      </div>

      <!-- 檔案：和電腦（或其他手機）互傳檔案與照片 -->
      <div id="panel-files" role="tabpanel" hidden>
        <div class="card files-send">
          <div class="drop">
            <span class="drop-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15.5V4.5M7.5 9 12 4.5 16.5 9"/><path d="M4.5 14.5v3.2a1.8 1.8 0 0 0 1.8 1.8h11.4a1.8 1.8 0 0 0 1.8-1.8v-3.2"/></svg></span>
            <p class="files-pending" id="files-pending" hidden></p>
            <button class="press btn primary" id="files-pick" type="button" data-i18n="files.pick"></button>
            <p class="hint" data-i18n="files.hint"></p>
          </div>
          <div class="files-to">
            <h3 class="files-h" data-i18n="files.to"></h3>
            <div class="chips files-peers" id="files-peers"></div>
          </div>
          <p class="hint" id="files-nopeers" data-i18n="files.noPeers" hidden></p>
          <button class="press btn primary" id="files-go" type="button" hidden></button>
        </div>
        <h3 class="section-label" id="files-inbox-h" data-i18n="files.inbox" hidden></h3>
        <ol class="list files-list" id="files-inbox"></ol>
        <h3 class="section-label" id="files-list-h" data-i18n="files.list" hidden></h3>
        <ol class="list files-list" id="files-list"></ol>
      </div>

      <!-- 歷史紀錄：各電腦備份到 Google Drive 的 -->
      <div id="panel-history" role="tabpanel" hidden>
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="search" type="search" autocomplete="off" data-i18n-placeholder="hist.search">
        </div>
        <div class="chips" id="chips"></div>
        <p class="hist-state" id="hist-state"></p>
        <ol class="list" id="hist-list"></ol>
        <button class="press btn ghost small" id="hist-more" type="button" data-i18n="hist.more" hidden></button>
      </div>

      <!-- 設定 -->
      <div id="panel-settings" role="tabpanel" hidden>
        <div class="group">
        <div class="card setting">
          <div><h3 data-i18n="set.auto"></h3><p data-i18n="set.autoDesc"></p></div>
          <input type="checkbox" class="switch" id="pref-auto">
        </div>
        <div class="card setting">
          <div><h3 data-i18n="set.bg"></h3><p data-i18n="set.bgDesc"></p></div>
          <input type="checkbox" class="switch" id="pref-bg">
        </div>
        <div class="card setting">
          <div><h3 data-i18n="set.lan"></h3><p data-i18n="set.lanDesc"></p><p class="note" id="lan-note" hidden></p></div>
          <input type="checkbox" class="switch" id="pref-lan">
        </div>
        <div class="card setting">
          <div><h3 data-i18n="set.ble"></h3><p data-i18n="set.bleDesc"></p><p class="note" id="ble-note" hidden></p></div>
          <input type="checkbox" class="switch" id="pref-ble">
        </div>
        <div class="card setting">
          <div><h3 data-i18n="set.remote"></h3><p data-i18n="set.remoteDesc"></p></div>
          <select class="select" id="pref-remote"></select>
        </div>
        <div class="card lang-setting" hidden>
          <button class="row-btn lang-open press" type="button">
            <h3 data-i18n="set.lang"></h3>
            <span class="value lang-name"></span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
        <div class="card">
          <h3 data-i18n="set.tile"></h3>
          <p data-i18n="set.tileDesc"></p>
        </div>
        </div>
        <button class="press btn ghost small" id="sign-out" type="button" data-i18n="in.signOut"></button>
      </div>
    </section>
  </main>

  <!-- 語言選單：從下方滑出，目前的語言有對勾 -->
  <div id="lang-sheet" hidden>
    <div class="sheet-scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lang-title">
      <div class="grab"></div>
      <h3 id="lang-title" data-i18n="set.lang"></h3>
      <div role="listbox" id="lang-options" aria-labelledby="lang-title"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <footer class="foot">
    <button class="lang-foot lang-open press" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span class="lang-name"></span>
    </button>
    <span data-i18n="foot"></span>
  </footer>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
