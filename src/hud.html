<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ctrl-C HUD</title>
    <link rel="stylesheet" href="hud.css" />
    <script type="module" src="hud.js"></script>
  </head>
  <body data-h="center" data-v="top">
    <main class="stage">
      <section id="hud" class="hud" data-variant="pill" role="status" aria-live="polite">
        <div class="tray" id="tray" aria-label="最近複製">
          <div class="tray-body">
            <div class="tray-inner">
              <p class="tray-label">最近複製</p>
              <ol class="tray-list" id="tray-list"></ol>
            </div>
          </div>
        </div>
        <div class="main" id="main">
          <span class="lead-slot" id="lead"></span>
          <div class="copy" id="copy">
            <p class="title"><span id="title"></span><span class="badge num" id="badge" hidden></span></p>
            <p class="detail" id="detail"></p>
          </div>
        </div>
      </section>
      <span id="dot" class="dot" aria-hidden="true"></span>
    </main>
  </body>
</html>
